name: Validate content

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/validate-content.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/validate-content.yml"

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check YAML syntax and formatting
        run: npx --yes prettier@3.5.3 --check "**/*.{yml,yaml}"

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Lint Markdown links and references
        run: npx --yes markdownlint-cli2@0.17.2
